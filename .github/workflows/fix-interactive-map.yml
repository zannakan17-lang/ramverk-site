name: Remove Russia map
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  remove-map:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove map section
        shell: python
        run: |
          from pathlib import Path
          import re, subprocess

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # Remove the complete section containing the interactive map.
          patterns = [
              r'<section(?=[^>]*class=["\'][^"\']*(?:interactive-map|map-section|russia-map)[^"\']*["\'])[^>]*>[\s\S]*?</section>',
              r'<div(?=[^>]*class=["\'][^"\']*(?:interactive-map|map-section)[^"\']*["\'])[^>]*>[\s\S]*?</div>'
          ]
          old = s
          for pattern in patterns:
              s = re.sub(pattern, '', s, count=1, flags=re.I)
          if s != old:
              p.write_text(s, encoding='utf-8')

          # Safety fallback: hide any remaining map wrapper without affecting other content.
          css = Path('style.css')
          c = css.read_text(encoding='utf-8')
          marker = '/* Map removed intentionally */'
          if marker not in c:
              c += '\n\n' + marker + '\n.interactive-map, section:has(.interactive-map), .map-section, .russia-map { display:none !important; }\n'
              css.write_text(c, encoding='utf-8')

          subprocess.run(['git','config','user.name','github-actions[bot]'], check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'], check=True)
          subprocess.run(['git','add','index.html','style.css'], check=True)
          if subprocess.run(['git','diff','--cached','--quiet']).returncode != 0:
              subprocess.run(['git','commit','-m','Remove Russia map section'], check=True)
              subprocess.run(['git','push'], check=True)
